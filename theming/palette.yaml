# ==============================================================================
# Rasmus Duret - shared theming source of truth
#
# This file is the single place color/font values are defined. Every
# per-language theme file under theming/<lang>/ should mirror these values
# exactly (most languages here can't parse YAML natively - e.g. Stata - so
# values are copy-embedded into each theme file rather than loaded at
# runtime). When you change a value here, update every theme file that
# embeds it.
#
# STATUS: font + qualitative palette are final (settled in the R palette
# tester, theming/wip/palettetester.R, and in use in theming/R/theme_rd.R).
# Semantic roles below (accent/positive/negative/neutral_grey/text) are not
# decided yet - do not treat those as real. Propagate any future change to
# the finalized fields into every per-language theme file (theming/R's
# theme_rd.R, theming/Stata, theming/python, theming/latex - the latter
# three are still placeholders themselves and haven't been built out yet).
# ==============================================================================

font:
  primary: Inter
  fallback: sans-serif

colors:
  # Core qualitative palette (categorical series, group comparisons).
  # Order: primary, secondary, contrast, extra accent.
  qualitative:
    - "#1E53A4"
    - "#CAB06B"
    - "#E72922"
    - "#006637"

  # Sequential (low -> high, single hue ramp). Not a fixed pair of hexes -
  # generated at runtime from the qualitative palette's primary colour
  # (#1E53A4) via a light/dark HCL ramp (rd_make_ramp() in theme_rd.R).
  sequential: "generated from qualitative[1] (primary) via rd_make_ramp()"

  # Diverging (negative <-> positive around a neutral midpoint). Same
  # approach: contrast colour's ramp (reversed) -> white -> primary ramp.
  diverging: "generated from qualitative[3] (contrast) reversed -> white -> qualitative[1] (primary), via rd_make_ramp()"

  # Semantic roles used across plots/tables - not decided yet.
  accent: "#TODO"
  positive: "#TODO"
  negative: "#TODO"
  neutral_grey: "#TODO"
  background: "#TODO"
  text: "#TODO"
